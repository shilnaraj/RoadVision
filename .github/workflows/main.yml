name : RoadVision CI

on :
 push :
  branches : ["master"]
  
 pull_request :
  branches : ["master"]

permissions:
  contents: read

jobs:
  build :
   runs-on: ubuntu-latest

   steps:
     - name : Checkout Code
       uses : actions/checkout@v4
     - name : Setup Flutter
       uses : subosito/flutter-action@v2
       with:
        channel : stable
        
     - name : Get dependencies
       run : flutter pub get

     - name : Run tests
       run : flutter test

     - name : Build APK
       run : flutter build apk --release
      
     

