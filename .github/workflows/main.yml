name : RoadVision CI

on :
 push :
  branches : ["master"]
  
 pull_request :
  branches : ["master"]

permissions:
  contents: read

jobs:
  build :
   runs-on: ubuntu-latest

   steps:
     - name : Checkout code
       uses : actions/checkout@4
       with:
        channel : stable
        
     - name : Get dependencies
       run : flutter pub get

     - name : Build APK
       run : flutter build apk 
      
     

